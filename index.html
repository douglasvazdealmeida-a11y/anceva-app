<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Anceva Serviços</title>
<meta name="theme-color" content="#2b2f35">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Archivo:wght@700;800&display=swap">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}

/* Layout: one column, phone first, big buttons; asphalt + safety yellow from the job site */
:root{
  --bg:#f3f2ee; --card:#ffffff; --fg:#1d1f22; --muted:#5d6168; --line:#d9d7d0;
  --accent:#f2b705; --accent-fg:#1d1f22; --dark:#2b2f35; --dark-fg:#ffffff;
  --ok:#1f7a3a; --ok-bg:#e3f2e7; --warn:#8a5a00; --warn-bg:#fff2cc; --danger:#b3261e;
  --f-display:"Archivo","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#17191c; --card:#22252a; --fg:#f1f1ee; --muted:#a8acb3; --line:#383c43;
  --accent:#f5c22e; --accent-fg:#17191c; --dark:#3a3f47; --dark-fg:#ffffff;
  --ok:#7fd69a; --ok-bg:#1e3326; --warn:#ffd36b; --warn-bg:#3a3010; --danger:#ff8a80; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#17191c; --card:#22252a; --fg:#f1f1ee; --muted:#a8acb3; --line:#383c43;
  --accent:#f5c22e; --accent-fg:#17191c; --dark:#3a3f47; --dark-fg:#ffffff;
  --ok:#7fd69a; --ok-bg:#1e3326; --warn:#ffd36b; --warn-bg:#3a3010; --danger:#ff8a80; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:19px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 40px}
#app{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:28px}h2{font-size:23px}
.brand{display:flex;align-items:center;gap:12px}
.brand .mark{width:46px;height:46px;border-radius:10px;background:var(--accent);display:grid;place-items:center;flex:none}
.brand small{display:block;color:var(--muted);font-size:15px}
button,.btn{font:inherit;font-weight:700;border:0;border-radius:14px;cursor:pointer;min-height:60px;padding:12px 18px;
  display:flex;align-items:center;justify-content:center;gap:10px;text-decoration:none;text-align:center;width:100%}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.primary{background:var(--accent);color:var(--accent-fg);font-size:22px;min-height:72px}
.dark{background:var(--dark);color:var(--dark-fg)}
.ghost{background:transparent;color:var(--fg);border:2px solid var(--line)}
.danger{background:transparent;color:var(--danger);border:2px solid var(--danger)}
.back{width:auto;min-height:48px;padding:8px 14px 8px 8px;background:transparent;color:var(--fg);border:2px solid var(--line);font-size:18px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{flex-direction:column;min-height:130px;font-size:21px;background:var(--card);color:var(--fg);border:3px solid var(--line)}
.tile.on{border-color:var(--accent);background:var(--warn-bg)}
.tile svg{width:54px;height:54px}
.list{display:flex;flex-direction:column;gap:10px}
.row{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;
  width:100%;text-align:left;font-weight:400;min-height:64px;color:var(--fg)}
.row .main{flex:1;min-width:0}
.row .name{font-weight:700;font-size:20px;overflow-wrap:anywhere}
.row .sub{color:var(--muted);font-size:16px}
.row .amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pill{display:inline-block;font-size:14px;font-weight:700;padding:3px 10px;border-radius:99px}
.pill.ok{background:var(--ok-bg);color:var(--ok)}.pill.warn{background:var(--warn-bg);color:var(--warn)}
label{display:flex;flex-direction:column;gap:6px;font-weight:700}
label .hint{font-weight:400;color:var(--muted);font-size:15px}
input,select{font:inherit;font-size:22px;padding:12px 14px;border-radius:12px;border:2px solid var(--line);background:var(--card);color:var(--fg);width:100%;min-height:58px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid2>*{min-width:0}
input[type=time],input[type=date]{min-width:0;font-size:20px;padding-inline:10px}
.total{background:var(--dark);color:var(--dark-fg);border-radius:14px;padding:14px 18px;display:flex;justify-content:space-between;align-items:center;font-size:21px;font-weight:700;font-variant-numeric:tabular-nums}
.total span:first-child{font-weight:400}
.muted{color:var(--muted)}
.empty{background:var(--card);border:2px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}
.section-title{font-size:15px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;margin:6px 0 -6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--dark);color:var(--dark-fg);
  padding:14px 22px;border-radius:14px;font-weight:700;z-index:20;max-width:calc(100% - 32px)}
.confirm{background:var(--warn-bg);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
/* Receipt paper: kept light in both themes, like the printed page */
.paper-wrap{overflow-x:auto;border-radius:6px}
.paper{background:#fff;color:#111;padding:26px 20px;width:560px;font-family:Calibri,Carlito,"Segoe UI",Arial,sans-serif;font-size:12px;box-shadow:0 2px 10px rgba(0,0,0,.15)}
.paper .hd{text-align:center;margin-bottom:22px}
.paper .hd b{font-size:15px;display:block}
.paper table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
.paper th,.paper td{border:1px solid #444;padding:4px 5px;text-align:center}
.paper th{background:#e8e8e8}
.paper tfoot td{font-weight:700}
.paper .fim{margin:22px 0 40px}
.paper .sig{text-align:center}
@media (max-width:380px){.big2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

.small{min-height:52px;font-size:17px}
.okb{border-color:var(--ok);color:var(--ok)}
.sync{border-radius:12px;padding:10px 14px;font-size:16px;font-weight:700;background:var(--card);color:var(--muted);border:2px solid var(--line);min-height:0;text-align:left;justify-content:flex-start}
.sync.ok{color:var(--ok);background:var(--ok-bg);border-color:transparent}
.sync.pend{color:var(--warn);background:var(--warn-bg);border-color:transparent}
.sync.erro{color:var(--danger);border-color:var(--danger);background:transparent}
</style>
</head>
<body>
<div id="app"><div class="empty">Carregando…</div></div>
<script src="jspdf.umd.min.js"></script>
<script src="jspdf.plugin.autotable.min.js"></script>
<script src="app.js"></script>
</body>
</html>
